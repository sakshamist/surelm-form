<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SureLM</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { margin-bottom: 0.5rem; font-size: 1.8rem; }
        p.subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 1rem; box-sizing: border-box; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #38bdf8; }
        
        /* Styling for the auto-filled referral input */
        input[readonly] { background: #1e293b; color: #38bdf8; border-color: #334155; cursor: default; }
        input[readonly]:focus { border-color: #334155; }
        
        button { background: #38bdf8; color: #0f172a; font-weight: 600; padding: 0.75rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join SureLM</h1>
        <p class="subtitle">SureLM builds systems for intelligent insurance distribution and is looking for people to contribute meaningfully without rigid roles.</p>
        
        <form id="surelm-form" action="send.php" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="fullname">First Name & Last Name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="linkedin">LinkedIn Profile / Website</label>
                <input type="url" id="linkedin" name="linkedin">
            </div>

            <div class="form-group">
                <label for="contribution">How would you like to contribute to SureLM?</label>
                <textarea id="contribution" name="contribution" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="interests">What about insurance, AI, systems, distribution, or our direction interests you?</label>
                <textarea id="interests" name="interests" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="work-showcase">Show us something you’ve worked on (code, design, writing, research, sales work, strategy, side projects, etc.)</label>
                <textarea id="work-showcase" name="work_showcase" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="ownership">If we gave you ownership tomorrow, what would you work on first?</label>
                <textarea id="ownership" name="ownership" rows="3" required></textarea>
            </div>

            <!-- Referral Field: Hidden by default, shown via Javascript -->
            <div id="referral-group" class="form-group hidden">
                <label for="referred_by">Referred by</label>
                <input type="text" id="referred_by" name="referred_by" readonly>
            </div>

            <div class="form-group">
                <label for="involvement">How involved are you looking to be?</label>
                <select id="involvement" name="involvement" required>
                    <option value="">Select option...</option>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Project-based">Project-based</option>
                    <option value="Internship">Internship</option>
                    <option value="Exploring / Not sure yet">Exploring / Not sure yet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="resume">Resume / Portfolio / Anything Relevant (Max 10MB)</label>
                <input type="file" id="resume" name="resume" required>
            </div>

            <button type="submit">Submit Application</button>
        </form>
    </div>

    <script>
        const validSlugs = {
            "soham": "Soham Suryavanshi",
            "saksham": "Saksham Tripathi",
            "harsh": "Harsh Srivastava",
            "harshit": "Harshit Rana"
        };

        // Get path segment (e.g., "/soham")
        const pathSegments = window.location.pathname.split("/").filter(Boolean);
        
        if (pathSegments.length > 0) {
            const slug = pathSegments[0].toLowerCase();
            
            if (validSlugs[slug]) {
                // Populate input and unhide group
                document.getElementById("referred_by").value = validSlugs[slug];
                document.getElementById("referral-group").classList.remove("hidden");
            } else {
                // Redirect invalid paths back to main form safely
                window.location.replace("/");
            }
        }
    </script>
</body>
</html>
